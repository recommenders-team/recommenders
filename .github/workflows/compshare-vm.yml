# This is a reusable workflow called by other workflows to run
# different groups of tests categorized by their types.
#
# Tests collected in tests/test_groups.yml, are grouped based on
# their
# * type
#   + pr_gate
#   + nightly
#   + experimental
# * compute
#   + cpu
#   + gpu
#   + spark
#
# In order to speed up testing, the testing workflows will run the
# tests in parallel according to the groups obtained from this
# action.

name: Tests

on:
  workflow_call:
    inputs:
      compute:
        required: false
        type: string
        default: cpu
        description: Test compute - cpu, gpu or spark.  It is only
          used for nightly not pr_gate
      config-file:
        required: false
        type: string
        default: tests/test_groups.yml
        description: Path to test group configuration file relative
          to the repo root
      compshare_tools_dir:
        required: false
        type: string
        default: .github/workflows/tools/compshare
        description: Path to the CompShare tools
      dockerfile:
        required: false
        type: string
        default: tools/docker/Dockerfile
        description: Path to the Dockerfile used for building the
          test environment
      pr_code_dir:
        required: false
        type: string
        default: ${{ github.event_name == 'pull_request_target' && format('pr_{0}', github.event.number) || '' }}
      timeout-minutes:
        required: true
        type: number
      type:
        required: true
        type: string
        description: Type of test - pr_gate or nightly
    secrets:
      COMPSHARE_PRIVATE_KEY:
        required: true

jobs:
  get-test-groups:
    # yq is required to run .github/actions/get-test-groups, and it
    # is preinstalled on ubuntu-24.04
    # (https://github.com/actions/runner-images/blob/9b8c9709431a8d2b295fd46cf96f283d671f20d9/images/ubuntu/Ubuntu2404-Readme.md?plain=1#L100)
    runs-on: ubuntu-24.04
    outputs:
      groups: ${{ steps.get-test-groups.outputs.groups }}
    steps:
      - name: Check out repository code from PR
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.number) || github.ref }}

      - name: Get test group names
        id: get-test-groups
        shell: bash
        run: |
          if [[ ${{ inputs.type }} == "nightly" ]]; then
            test_groups_str=$(yq -o json -I 0 '
              [ .${{ inputs.type }}
                | keys
                | .[]
                | select(contains("${{ inputs.compute }}"))
              ]' \
              ${{ inputs.config-file }})
          else
            test_groups_str=$(yq -o json -I 0 \
              '.${{ inputs.type }} | keys' ${{ inputs.config-file }})
          fi
          echo "Test Groups: ${test_groups_str}"
          echo "groups=${test_groups_str}" >> ${GITHUB_OUTPUT}

  execute-tests:
    name: ${{ join(matrix.*, ', ') }}
    needs: get-test-groups
    # Docker and sshpass are required on the runner.
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        shell: bash
    strategy:
      max-parallel: 6
      matrix:
        python-version:
          - '3.9'
          - '3.10'
          - '3.11'
        group: ${{ fromJSON(needs.get-test-groups.outputs.groups) }}
    steps:
      - name: Check out repository code from main
        uses: actions/checkout@v6

      - name: Setup VM
        # * GPU tests should run on GPUs.
        # * cpu-nightly needs to run on larger CPU runner.
        # * Otherwise, standard runner is enough.
        if: ${{ contains(matrix.group, 'gpu') || (contains(inputs.type, 'nightly') && contains(matrix.group, 'cpu')) }}
        env:
          COMPSHARE_PRIVATE_KEY: ${{ secrets.COMPSHARE_PRIVATE_KEY }}
          COMPSHARE_PUBLIC_KEY: ${{ vars.COMPSHARE_PUBLIC_KEY }}
          SCRIPT_SETUP: ${{ inputs.compshare_tools_dir }}/setup_vm.sh
          SCRIPT_UTILS: ${{ inputs.compshare_tools_dir }}/utils.sh
          VM_DOCKER_MIRROR_URL: ${{ vars.VM_DOCKER_MIRROR_URL }}
          VM_HTTP_PROXY: ${{ vars.VM_HTTP_PROXY }}
          VM_HTTPS_PROXY: ${{ vars.VM_HTTPS_PROXY }}
          VM_PROXY_CERTIFICATE: ${{ vars.VM_PROXY_CERTIFICATE }}
        run: |
          echo "::add-mask::$COMPSHARE_PRIVATE_KEY"
          if [[ '${{ github.event_name }}' == 'pull_request_target' ]]
          then
              commit="$(echo ${{ github.event.pull_request.head.sha }} \
                  | head -c 5)"
              vm_name="vm_${{ github.event.number }}_${commit}_XXXXXX"
          else
              commit="$(echo ${{ github.sha }} | head -c 5)"
              vm_name="vm_${commit}_XXXXXX"
          fi
          vm_name="$(mktemp -u ${vm_name})"
          echo "VM_NAME=${vm_name}" >> "${GITHUB_ENV}"

          if [[ '${{ inputs.type }}' == *nightly* ]]
          then
              gpu_type='"GPUType": "!2080,P40"'
              gpu_mem='"Memory": {"GPU": 12, "CPU": 32}'
              charge_type='"ChargeType": ["Postpay"]'
          else
              gpu_type='"GPUType": "!P40"'
              gpu_mem='"Memory": {"GPU": 8, "CPU": 32}'
              charge_type='"ChargeType": ["Spot","Postpay"]'
          fi
          requirements="{${gpu_type}, ${gpu_mem}, ${charge_type}}"
          bash "${SCRIPT_SETUP}" "${vm_name}" "${requirements}"

          echo 'Exporting VM info for subsequent steps ...'
          source "${SCRIPT_UTILS}"
          mapfile -t vm_info < <(get_vm_info "${vm_name}")
          ssh_dest="${vm_info[1]}"
          echo "SSH_DEST=${ssh_dest}" >> "$GITHUB_ENV"

      - name: Check out repository code from PR
        if: ${{ github.event_name == 'pull_request_target' }}
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.number }}/merge
          path: ${{ inputs.pr_code_dir }}

      - name: Build image
        env:
          SCRIPT_UTILS: ${{ inputs.compshare_tools_dir }}/utils.sh
          VM_HTTP_PROXY: ${{ vars.VM_HTTP_PROXY }}
          VM_HTTPS_PROXY: ${{ vars.VM_HTTPS_PROXY }}
          VM_PIP_INDEX_URL: ${{ vars.VM_PIP_INDEX_URL }}
          VM_PROXY_CERTIFICATE: ${{ vars.VM_PROXY_CERTIFICATE }}
        working-directory: ${{ github.event_name == 'pull_request_target' && inputs.pr_code_dir || github.workspace }}
        run: |
          if [[ '${{ github.event_name }}' == 'pull_request_target' ]]
          then
              commit="$(echo ${{ github.event.pull_request.head.sha }} \
                  | head -c 5)"
          else
              commit="$(echo ${{ github.sha }} | head -c 5)"
          fi
          image_tag='reco-${commit}-${{ github.run_attempt }}'

          # Export IMAGE_TAG for subsequent steps
          echo "IMAGE_TAG=${image_tag}" >> "${GITHUB_ENV}"

          dockerfile="${{ inputs.dockerfile }}"
          compute="${{ contains(matrix.group, 'gpu') && 'gpu' || 'cpu' }}"
          extras_gpu="${{ contains(matrix.group, 'gpu') && ',gpu' || '' }}"
          extras_spark="${{ contains(matrix.group, 'spark') && ',spark' || '' }}"
          extras="[dev${extras_gpu}${extras_spark}]"
          python_version="${{ matrix.python-version }}"
          docker_args="-t ${image_tag} \
              -f ${dockerfile} \
              --build-arg COMPUTE=${compute} \
              --build-arg EXTRAS=${extras} \
              --build-arg GIT_REF= \
              --build-arg PYTHON_VERSION=${python_version}"

          if [[ -z "${SSH_DEST}" ]]; then
              echo 'Building Docker image on the current GitHub-hosted runner ...'
              docker build . ${docker_args}
          else
              echo "Building Docker image on the VM ${VM_NAME} ..."
              echo '* Copying repo files to avoid git clone failure on the VM ...'
              tar cf ../recommenders.tar *
              scp -q -o StrictHostKeyChecking=no \
                  -o UserKnownHostsFile=/dev/null \
                  ../recommenders.tar "${SSH_DEST}":
              rm -rf ../recommenders.tar
              ssh -t -o StrictHostKeyChecking=no \
                  -o UserKnownHostsFile=/dev/null \
                  "${SSH_DEST}" "\
                      mkdir recommenders \
                      && tar xf recommenders.tar -C recommenders \
                      && rm -rf recommenders.tar"

              pip_index_ip="$(echo "${VM_PIP_INDEX_URL:-}"
                  | sed -e 's|^.*://||' -e 's|:.*$||')"
              pip_index_ip="${pip_index_ip:+,$pip_index_ip}"
              docker_no_proxy="developer.download.nvidia.com${pip_index_ip}"
              docker_args="${docker_args} \
                  --build-arg HTTP_PROXY='${VM_HTTP_PROXY}' \
                  --build-arg http_proxy='${VM_HTTP_PROXY}' \
                  --build-arg HTTPS_PROXY='${VM_HTTPS_PROXY}' \
                  --build-arg https_proxy='${VM_HTTPS_PROXY}' \
                  --build-arg NO_PROXY='${docker_no_proxy}' \
                  --build-arg no_proxy='${docker_no_proxy}' \
                  --build-arg VM_PIP_INDEX_URL='${VM_PIP_INDEX_URL}' \
                  --build-arg VM_PROXY_CERTIFICATE='${VM_PROXY_CERTIFICATE}' \
                  --build-arg UV_INSECURE_HOST='github.com'"

              echo '* Building the final image ...'
              source "${SCRIPT_UTILS}"
              run_cmd_retry ssh -t -o StrictHostKeyChecking=no \
                  -o UserKnownHostsFile=/dev/null \
                  -o ServerAliveInterval=60 \
                  -o ServerAliveCountMax=10 \
                  "${SSH_DEST}" "\
                      cd recommenders; \
                      docker build . ${docker_args}"
          fi

      - name: Execute tests in container
        env:
          VM_HTTP_PROXY: ${{ vars.VM_HTTP_PROXY }}
          RECO_VENV_DIR: /root/.venvs/Recommenders
        working-directory: ${{ github.event_name == 'pull_request_target' && inputs.pr_code_dir || github.workspace }}
        run: |
          test_list="$(yq '
              .${{ inputs.type }}.${{ matrix.group }}
              | map(@sh)
              | join(" ")' \
              "${{ inputs.config-file }}")"
          test_cmd="source /root/.sdkman/bin/sdkman-init.sh \
              && source ${{ env.RECO_VENV_DIR }}/bin/activate \
              && pytest --durations 0 ${test_list}"

          if [[ -z "${SSH_DEST}" ]]; then
              # Run on current GitHub-hosted runner directly
              docker run --rm ${IMAGE_TAG} bash -lc "${test_cmd}"
          else
              # Run on newly created self-hosted runner by SSH
              check_gpu="${{ contains(matrix.group, 'gpu') && 'nvidia-smi' || 'true' }}"
              gpu_arg="${{ contains(matrix.group, 'gpu') && '--gpus all' || '' }}"
              docker_args="${gpu_arg} \
                  --env HTTP_PROXY='${VM_HTTP_PROXY}' \
                  --env http_proxy='${VM_HTTP_PROXY}'"
              ssh -t -o StrictHostKeyChecking=no \
                  -o UserKnownHostsFile=/dev/null \
                  -o ServerAliveInterval=60 \
                  -o ServerAliveCountMax=10 \
                  "${SSH_DEST}" "\
                      ${check_gpu} \
                      && docker run --rm ${docker_args} ${IMAGE_TAG} \
                          bash -lc '${test_cmd}'"
          fi

      - name: Clean up
        if: always()
        env:
          COMPSHARE_PRIVATE_KEY: ${{ secrets.COMPSHARE_PRIVATE_KEY }}
          COMPSHARE_PUBLIC_KEY: ${{ vars.COMPSHARE_PUBLIC_KEY }}
          SCRIPT_DELETE: ${{ inputs.compshare_tools_dir }}/delete_vm.sh
        run: |
          bash "${SCRIPT_DELETE}" "${VM_NAME}"
